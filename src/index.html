<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Management Application</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; line-height: 1.6; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: #f9f9f9; padding: 20px; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 20px; }
    .form-group { margin-bottom: 12px; }
    label { display: inline-block; width: 120px; font-weight: bold; }
    input { padding: 6px; width: 250px; }
    
    button { padding: 6px 12px; border: none; cursor: pointer; border-radius: 3px; font-weight: bold; }
    .btn-save { background: #28a745; color: white; }
    .btn-cancel { background: #6c757d; color: white; margin-left: 5px; }
    .btn-edit { background: #ffc107; color: #333; margin-right: 5px; }
    .btn-delete { background: #dc3545; color: white; }
    .btn-search { background: #007bff; color: white; }
    .btn-display { background: #17a2b8; color: white; margin-left: 5px; }

    .search-container { display: flex; gap: 8px; margin-bottom: 15px; }
    .search-input { flex-grow: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    
    /* Notification Banner */
    .alert { padding: 12px; margin-bottom: 20px; border-radius: 4px; display: none; font-weight: bold; }
    .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #eee; }
    .no-data { text-align: center; color: #777; font-style: italic; }
  </style>
</head>
<body>

<div class="container">
  <h1>Employee Registration</h1>

  <div id="alertBox" class="alert"></div>

  <div class="card">
    <h3 id="formTitle">Add New Employee</h3>
    <form id="employeeForm">
      <input type="hidden" id="mongoDbId">
      
      <div class="form-group">
        <label>Employee ID:</label>
        <input type="text" id="employeeId" required>
      </div>
      <div class="form-group">
        <label>Name:</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label>Designation:</label>
        <input type="text" id="designation" required>
      </div>
      <div class="form-group">
        <label>Email:</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>Salary:</label>
        <input type="number" id="salary" required>
      </div>

      <button type="submit" class="btn-save" id="submitBtn">Save Employee</button>
      <button type="button" class="btn-cancel" id="cancelBtn" onclick="resetForm()" style="display: none;">Cancel Edit</button>
    </form>
  </div>

  <!-- Search & Directory Display -->
  <div class="card">
    <h3>Employee Directory</h3>
    
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Search by name, ID, email, or designation...">
      <button class="btn-search" onclick="searchEmployees()">Search</button>
      <button class="btn-display" onclick="fetchEmployees()">Display All</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Designation</th>
          <th>Email</th>
          <th>Salary</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="employeeTableBody">
        <!-- Dynamic content -->
      </tbody>
    </table>
  </div>
</div>

<script>
  let allEmployees = [];
  function showAlert(message, isSuccess = true) {
    const alertBox = document.getElementById('alertBox');
    alertBox.innerText = message;
    alertBox.className = isSuccess ? 'alert alert-success' : 'alert alert-danger';
    alertBox.style.display = 'block';

    if (isSuccess) {
      setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
    }
  }

  function hideAlert() {
    document.getElementById('alertBox').style.display = 'none';
  }

  async function fetchEmployees() {
    try {
      document.getElementById('searchInput').value = '';
      const res = await fetch('/api/employees');
      const data = await res.json();

      if (!res.ok) {
        showAlert(data.error || 'Failed to communicate with database', false);
        renderEmployees([]);
        return;
      }

      allEmployees = data;
      renderEmployees(allEmployees);
    } catch (err) {
      showAlert('Database connection error. Unable to reach backend server.', false);
      renderEmployees([]);
    }
  }

  function renderEmployees(employees) {
    const tbody = document.getElementById('employeeTableBody');
    tbody.innerHTML = '';

    if (employees.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="no-data">No employees found</td></tr>`;
      return;
    }

    employees.forEach(emp => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${emp.employeeId}</td>
        <td>${emp.name}</td>
        <td>${emp.designation}</td>
        <td>${emp.email}</td>
        <td>$${emp.salary}</td>
        <td>
          <button class="btn-edit" onclick="populateEditForm('${emp._id}')">Edit</button>
          <button class="btn-delete" onclick="deleteEmployee('${emp._id}')">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function searchEmployees() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!query) {
      renderEmployees(allEmployees);
      return;
    }

    const filtered = allEmployees.filter(emp =>
      emp.employeeId.toLowerCase().includes(query) ||
      emp.name.toLowerCase().includes(query) ||
      emp.designation.toLowerCase().includes(query) ||
      emp.email.toLowerCase().includes(query)
    );
    
    renderEmployees(filtered);
  }

  document.getElementById('employeeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert();

    const id = document.getElementById('mongoDbId').value;
    const data = {
      employeeId: document.getElementById('employeeId').value,
      name: document.getElementById('name').value,
      designation: document.getElementById('designation').value,
      email: document.getElementById('email').value,
      salary: document.getElementById('salary').value
    };

    const url = id ? `/api/employees/${id}` : '/api/employees';
    const method = id ? 'PUT' : 'POST';

    try {
      const res = await fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const result = await res.json();

      if (res.ok) {
        showAlert(result.message || 'Employee added successfully!', true);
        resetForm();
        fetchEmployees();
      } else {
        showAlert(result.error || 'Failed to save employee to database.', false);
      }
    } catch (err) {
      showAlert('Database connection error. Unable to complete request.', false);
    }
  });

  function populateEditForm(id) {
    const emp = allEmployees.find(e => e._id === id);
    if (!emp) return;

    document.getElementById('mongoDbId').value = emp._id;
    document.getElementById('employeeId').value = emp.employeeId;
    document.getElementById('name').value = emp.name;
    document.getElementById('designation').value = emp.designation;
    document.getElementById('email').value = emp.email;
    document.getElementById('salary').value = emp.salary;

    document.getElementById('formTitle').innerText = 'Update Employee';
    document.getElementById('submitBtn').innerText = 'Update Employee';
    document.getElementById('cancelBtn').style.display = 'inline-block';
  }

  function resetForm() {
    document.getElementById('mongoDbId').value = '';
    document.getElementById('employeeForm').reset();
    document.getElementById('formTitle').innerText = 'Add New Employee';
    document.getElementById('submitBtn').innerText = 'Save Employee';
    document.getElementById('cancelBtn').style.display = 'none';
  }

  async function deleteEmployee(id) {
    if (confirm('Are you sure you want to delete this record?')) {
      try {
        const res = await fetch(`/api/employees/${id}`, { method: 'DELETE' });
        const result = await res.json();
        if (res.ok) {
          showAlert(result.message || 'Employee deleted successfully!', true);
          fetchEmployees();
        } else {
          showAlert(result.error || 'Failed to delete employee.', false);
        }
      } catch (err) {
        showAlert('Database connection error. Unable to delete record.', false);
      }
    }
  }

  fetchEmployees();
</script>

</body>
</html>
